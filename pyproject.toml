[project]
name = "dygrav"
version = "0.1.0"
description = "DyGRAV: Dynamic Grounding & Relational Reasoning for VLN"
requires-python = ">=3.10"
readme = "README.md"
license = {text="MIT"}

# Keep runtime deps minimal so unit tests pass without heavy installs.
dependencies = [
  "numpy",
  "Pillow",
  "rich>=13.7",
  "omegaconf>=2.3",
]

[project.optional-dependencies]
full = [
  "torch>=2.2",
  "torchvision",
  "hydra-core>=1.3",
  "pydantic>=2.7",
  "open-clip-torch>=2.24",
  "pytorch-lightning>=2.4",
  "ultralytics>=8.2",
]
dev = [
  "pytest>=8.3",
  "pytest-cov",
  "black",
  "ruff",
  "mypy"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
